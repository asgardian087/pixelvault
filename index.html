<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PDF Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f1f1;
        }

        header {
            padding: 15px;
            background: #222;
            color: white;
            text-align: center;
        }

        main {
            padding: 15px;
        }

        .pdf-container {
            width: 100%;
            height: 85vh;
            min-height: 500px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 6px;
            overflow: hidden;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }

        .fallback {
            margin-top: 12px;
            text-align: center;
        }

        .fallback a {
            color: #075bc8;
        }
    </style>
</head>

<body>
    <header>
        <h2>My PDF Viewer</h2>
    </header>

    <main>
        <div class="pdf-container">
            <iframe
                src="./areu.pdf"
                title="PDF document viewer">
            </iframe>
        </div>

        <div class="fallback">
            <a href="./areu.pdf" target="_blank" rel="noopener">
                Open PDF separately if the viewer does not work
            </a>
        </div>
    </main>
</body>
</html>
